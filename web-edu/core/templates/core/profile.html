{% extends 'core/layout.html' %}
{% block title %} Настройки {% endblock %}

{% block user %}
<div class="user-block">
    <div class="user-info">
        <a href="{% url 'profile' %}" class="profile" title="Профиль"></a>
        <span class="user-name">Dr. Pepper</span>
    </div>
</div>
{% endblock %}

{% block main %}
<section class="form-page">
    <h1 class="page-title">Настройки: Dr. Pepper</h1>

    <div class="form-error">
        Никнейм уже занят другим пользователем!
    </div>

    <form class="auth-form" action="#" method="post" enctype="multipart/form-data">
        <div class="form-group">
            <label for="prof-login">Логин</label>
            <input type="text" id="prof-login" name="login" value="dr_pepper" readonly>
            <span class="field-hint">Логин нельзя изменить</span>
        </div>

        <div class="form-group">
            <label for="prof-email">Email</label>
            <input type="email" id="prof-email" name="email" value="drpepper@mail.ru" required>
        </div>

        <div class="form-group">
            <label for="prof-nickname">Никнейм</label>
            <input type="text" id="prof-nickname" name="nickname" value="Dr. Pepper" required>
            <span class="field-error">Этот никнейм уже занят</span>
        </div>

        <div class="form-group avatar-group">
            <label>Аватар</label>
            <div class="avatar-upload">
                <div class="avatar-preview">
                </div>
                <div class="avatar-controls">
                    <input type="file" id="prof-avatar" name="avatar" accept="image/*">
                    <label for="prof-avatar" class="btn-choose">Выбрать</label>
                </div>
            </div>
        </div>

        <div class="confims">
            <button type="submit" class="btn-submit">Сохранить</button>
            <a href="{% url 'signup' %}" class="btn-out">Выйти</a>
        </div>
    </form>
</section>
{% endblock %}
