{% load static %}
<nav class="pagination" aria-label="Навигация по страницам">
    {% if page_obj.has_previous %}
        <a href="?page={{ page_obj.previous_page_number }}" class="page-link">« Назад</a>
    {% else %}
        <span class="page-disabled">« Назад</span>
    {% endif %}

    {% for num in page_obj.paginator.page_range %}
        {% if page_obj.number == num %}
            <a class="page-active" href="#">{{ num }}</a>
        {% else %}
            <a href="?page={{ num }}" class="page-link">{{ num }}</a>
        {% endif %}
    {% endfor %}

    {% if page_obj.has_next %}
        <a href="?page={{ page_obj.next_page_number }}" class="page-link">Вперед »</a>
    {% else %}
        <span class="page-disabled">Вперед »</span>
    {% endif %}
</nav>
