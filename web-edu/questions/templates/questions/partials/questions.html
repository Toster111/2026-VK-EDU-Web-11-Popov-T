<article class="question">
    <div class="question-content">
        <h3 class="question-title">
            <a href="{% url 'index' question.id %}">{{ question.header }}</a>
        </h3>
        <p class="question-text">{{ question.text|truncatechars:50 }}</p>
        <div class="question-meta-base">
            {% for tag in question.tag %}
                <a href="{% url 'tags' tag %}" class="tag">{{ tag }}</a>
            {% endfor %}
            <span class="author">👤 {{ question.author }}</span>
            <span class="date">📅 {{ question.date }}</span>
        </div>
    </div>
    <div class="rating">
        <button class="btn up">▲</button>
        <span class="score">{{ question.rating }}</span>
        <button class="btn down">▼</button>
    </div>
</article>
